<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Movie World</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f0f0f;
      color: #f1f1f1;
      padding-bottom: 70px;
    }

    /* Header */
    header {
      background: #0f0f0f;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #222;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
    }

    .brand i {
      color: #ff0000;
      font-size: 1.5rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* Search Bar */
    .search-bar-wrap {
      display: none;
      padding: 10px 16px;
      background: #181818;
      border-bottom: 1px solid #282828;
    }

    .search-bar-wrap.open {
      display: flex;
      gap: 10px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #121212;
      border-radius: 25px;
      padding: 6px 14px;
      flex: 1;
      border: 1px solid #333;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      width: 100%;
      font-size: 0.95rem;
    }

    /* Chips */
    .chips-bar {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      white-space: nowrap;
      background: #0f0f0f;
      scrollbar-width: none;
      border-bottom: 1px solid #1a1a1a;
    }

    .chips-bar::-webkit-scrollbar { display: none; }

    .chip {
      background: #272727;
      color: #f1f1f1;
      border: none;
      padding: 7px 15px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .chip.active {
      background: #fff;
      color: #000;
      font-weight: 600;
    }

    /* Video Feed List */
    .feed-container {
      padding: 10px 0;
    }

    .feed-item {
      margin-bottom: 22px;
      cursor: pointer;
    }

    .feed-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #1f1f1f;
    }

    .feed-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .feed-duration {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.8);
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .feed-meta {
      display: flex;
      gap: 12px;
      padding: 10px 16px 0;
    }

    .feed-channel-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #e50914;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      flex-shrink: 0;
    }

    .feed-details { flex: 1; }

    .feed-title {
      font-size: 0.95rem;
      line-height: 1.35;
      font-weight: 500;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .feed-sub {
      font-size: 0.8rem;
      color: #aaa;
    }

    /* Player View */
    #watchView {
      display: none;
    }

    .player-container {
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-info-box {
      padding: 14px 16px;
      border-bottom: 1px solid #222;
    }

    .video-info-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    /* Action buttons */
    .action-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 6px;
    }

    .action-row::-webkit-scrollbar { display: none; }

    .action-pill {
      background: #272727;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .action-pill.download-btn {
      background: #00b4d8;
      color: #000;
    }

    /* Sleep menu */
    #sleepMenu {
      display: none;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      margin: 10px 0;
      overflow: hidden;
    }

    #sleepMenu div {
      padding: 10px 16px;
      font-size: 0.85rem;
      cursor: pointer;
      border-bottom: 1px solid #292929;
    }

    #sleepMenu div:hover {
      background: #ff0000;
    }

    /* Bottom Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: #0f0f0f;
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      background: none;
      border: none;
      color: #aaa;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.7rem;
      gap: 4px;
      cursor: pointer;
    }

    .nav-item.active { color: #fff; }
    .nav-item i { font-size: 1.25rem; }

    /* Modal for API Key */
    .key-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .key-modal.open { display: flex; }

    .key-box {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 22px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .key-box input {
      width: 100%;
      padding: 10px;
      margin: 15px 0;
      background: #111;
      border: 1px solid #444;
      color: #fff;
      border-radius: 8px;
      outline: none;
    }

    .key-box button {
      background: #ff0000;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand" onclick="goHome()">
      <i class="fa-brands fa-youtube"></i> Movie World
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleSearchBar()"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button class="icon-btn" onclick="openKeyModal()"><i class="fa-solid fa-key"></i></button>
    </div>
  </header>

  <!-- Search Bar -->
  <div class="search-bar-wrap" id="searchWrap">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search Movie, Anime, South Dubbed..." />
    </div>
    <button class="icon-btn" onclick="triggerSearch()"><i class="fa-solid fa-arrow-right"></i></button>
  </div>

  <!-- Filter Chips -->
  <div class="chips-bar" id="categoryChips">
    <button class="chip active" onclick="loadCategory('Latest Hindi Dubbed Movies', this)">All</button>
    <button class="chip" onclick="loadCategory('South Hindi Dubbed Blockbuster Movies', this)">South Dubbed</button>
    <button class="chip" onclick="loadCategory('Bollywood Superhit Movies', this)">Bollywood</button>
    <button class="chip" onclick="loadCategory('Hollywood Hindi Action Movies', this)">Action</button>
    <button class="chip" onclick="loadCategory('Hindi Dubbed Anime Series', this)">Anime</button>
    <button class="chip" onclick="loadCategory('Full Comedy Movies Hindi', this)">Comedy</button>
  </div>

  <!-- Home Feed -->
  <div id="homeView">
    <div class="feed-container" id="feedList"></div>
  </div>

  <!-- Watch Page View -->
  <div id="watchView">
    <div class="player-container">
      <iframe id="videoIframe" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>

    <div class="video-info-box">
      <h2 class="video-info-title" id="playerTitle">Movie Title</h2>

      <div class="action-row">
        <button class="action-pill" id="likeBtn" onclick="toggleLike()">
          <i class="fa-regular fa-thumbs-up" id="likeIcon"></i> <span id="likeCount">142K</span>
        </button>
        <button class="action-pill download-btn" onclick="downloadCurrentVideo()">
          <i class="fa-solid fa-download"></i> Download Video
        </button>
        <button class="action-pill" onclick="toggleSleepMenu()">
          <i class="fa-solid fa-moon"></i> <span id="sleepBtnText">Sleep Timer</span>
        </button>
        <button class="action-pill" onclick="shareVideo()">
          <i class="fa-solid fa-share"></i> Share
        </button>
      </div>

      <!-- Sleep Menu -->
      <div id="sleepMenu">
        <div onclick="setSleep(15)">15 Minutes</div>
        <div onclick="setSleep(30)">30 Minutes</div>
        <div onclick="setSleep(60)">1 Hour</div>
        <div onclick="setSleep(0)">Turn Off Timer</div>
      </div>
    </div>

    <div style="padding: 12px 16px; font-weight: 600; color: #aaa;">Up Next / Related</div>
    <div class="feed-container" id="relatedList"></div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="goHome()">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </button>
    <button class="nav-item" onclick="toggleSearchBar()">
      <i class="fa-solid fa-compass"></i>
      <span>Explore</span>
    </button>
    <button class="nav-item" onclick="openKeyModal()">
      <i class="fa-solid fa-gear"></i>
      <span>Settings</span>
    </button>
  </nav>

  <!-- Key Modal -->
  <div class="key-modal" id="keyModal">
    <div class="key-box">
      <h3>YouTube API Key</h3>
      <p style="font-size: 0.85rem; color: #aaa; margin: 10px 0;">Apni YouTube Data API v3 key enter karein:</p>
      <input type="text" id="apiKeyInput" placeholder="AIzaSy..." />
      <button onclick="saveApiKey()">Save & Start 🚀</button>
    </div>
  </div>

  <script>
    let currentVideoId = "";
    let isLiked = false;
    let sleepTimer = null;

    function getApiKey() {
      return localStorage.getItem("mw_youtube_api_key") || "";
    }

    function openKeyModal() {
      document.getElementById("apiKeyInput").value = getApiKey();
      document.getElementById("keyModal").classList.add("open");
    }

    function closeKeyModal() {
      document.getElementById("keyModal").classList.remove("open");
    }

    function saveApiKey() {
      const val = document.getElementById("apiKeyInput").value.trim();
      if (!val) {
        alert("Pehle key paste karo bhai!");
        return;
      }
      localStorage.setItem("mw_youtube_api_key", val);
      closeKeyModal();
      fetchVideos("Latest Hindi Dubbed Movies");
    }

    function toggleSearchBar() {
      const wrap = document.getElementById("searchWrap");
      wrap.classList.toggle("open");
      if (wrap.classList.contains("open")) {
        document.getElementById("searchInput").focus();
      }
    }

    function triggerSearch() {
      const q = document.getElementById("searchInput").value.trim();
      if (q) {
        goHome();
        fetchVideos(q + " full movie");
      }
    }

    function goHome() {
      document.getElementById("watchView").style.display = "none";
      document.getElementById("homeView").style.display = "block";
      document.getElementById("categoryChips").style.display = "flex";
      document.getElementById("videoIframe").src = "";
      window.scrollTo(0, 0);
    }

    function loadCategory(query, btn) {
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      fetchVideos(query);
    }

    async function fetchVideos(query, isRelated = false) {
      const key = getApiKey();
      if (!key) {
        openKeyModal();
        return;
      }

      const target = isRelated ? document.getElementById("relatedList") : document.getElementById("feedList");
      if (!isRelated) {
        target.innerHTML = `<p style="padding: 40px; text-align: center; color: #888;">Movies dhoondh rahe hain... 🍿</p>`;
      }

      const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=15&q=${encodeURIComponent(query)}&type=video&key=${key}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.error) {
          target.innerHTML = `<p style="padding: 20px; color: #ff4d4d; text-align: center;">Error: ${data.error.message}</p>`;
          return;
        }

        target.innerHTML = "";
        data.items.forEach(item => {
          const vid = item.id.videoId;
          const title = item.snippet.title;
          const channel = item.snippet.channelTitle;
          const thumb = item.snippet.thumbnails.high?.url || item.snippet.thumbnails.medium?.url;

          const card = document.createElement("div");
          card.className = "feed-item";
          card.onclick = () => playVideo(vid, title);

          card.innerHTML = `
            <div class="feed-thumb">
              <img src="${thumb}" alt="${title}" loading="lazy"/>
              <span class="feed-duration">Full HD</span>
            </div>
            <div class="feed-meta">
              <div class="feed-channel-avatar">${channel.charAt(0)}</div>
              <div class="feed-details">
                <div class="feed-title">${title}</div>
                <div class="feed-sub">${channel} • Movie World</div>
              </div>
            </div>
          `;
          target.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        target.innerHTML = `<p style="padding: 20px; color: red; text-align: center;">Video load nahi huye! Check connection.</p>`;
      }
    }

    function playVideo(vid, title) {
      currentVideoId = vid;
      document.getElementById("homeView").style.display = "none";
      document.getElementById("categoryChips").style.display = "none";
      document.getElementById("watchView").style.display = "block";

      document.getElementById("playerTitle").innerText = title;
      document.getElementById("videoIframe").src = `https://www.youtube.com/embed/${vid}?autoplay=1&rel=0`;

      fetchVideos(title, true);
      window.scrollTo(0, 0);
    }

    function toggleLike() {
      isLiked = !isLiked;
      const icon = document.getElementById("likeIcon");
      const count = document.getElementById("likeCount");
      if (isLiked) {
        icon.className = "fa-solid fa-thumbs-up";
        icon.style.color = "#ff0000";
        count.innerText = "143K";
      } else {
        icon.className = "fa-regular fa-thumbs-up";
        icon.style.color = "#fff";
        count.innerText = "142K";
      }
    }

    function downloadCurrentVideo() {
      if (!currentVideoId) return;
      window.open(`https://yt1s.com.co/en/?q=https://www.youtube.com/watch?v=${currentVideoId}`, '_blank');
    }

    function shareVideo() {
      const url = `https://youtu.be/${currentVideoId}`;
      if (navigator.share) {
        navigator.share({ title: document.getElementById("playerTitle").innerText, url: url });
      } else {
        navigator.clipboard.writeText(url);
        alert("Link copied! Share kar do.");
      }
    }

    function toggleSleepMenu() {
      const menu = document.getElementById("sleepMenu");
      menu.style.display = menu.style.display === "block" ? "none" : "block";
    }

    function setSleep(min) {
      clearTimeout(sleepTimer);
      document.getElementById("sleepMenu").style.display = "none";
      const txt = document.getElementById("sleepBtnText");

      if (min === 0) {
        txt.innerText = "Sleep Timer";
        alert("Timer OFF ho gaya!");
        return;
      }

      txt.innerText = `${min}m 🌙`;
      alert(`Sleep timer ${min} minute ke liye set ho gaya!`);

      sleepTimer = setTimeout(() => {
        document.getElementById("videoIframe").src = "";
        alert("Sleep Timer: Movie stop ho gayi! So jao ab 😴");
        txt.innerText = "Sleep Timer";
      }, min * 60 * 1000);
    }

    document.getElementById("searchInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") triggerSearch();
    });

    // Start App
    window.onload = () => {
      if (!getApiKey()) {
        openKeyModal();
      } else {
        fetchVideos("Latest Hindi Dubbed Movies");
      }
    };
  </script>
</body>
</html>
